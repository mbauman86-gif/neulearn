<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Neulearn Lesson Player - Phonics /sh/</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Inter:wght@400;500;600&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'surface-canvas': '#F5EFE2',
                        'surface-raised': '#FBF7EC',
                        'ink-primary': '#2A2520',
                        'ink-secondary': '#5C5346',
                        'amber-500': '#C8923A',
                        'moss-500': '#6F8A52',
                        'slate-500': '#496478',
                        'faith-gold': '#D6A85B',
                        'status-error': '#A14A3A'
                    },
                    borderRadius: {
                        'DEFAULT': '0.5rem',
                        'lg': '1rem',
                        'xl': '1.5rem',
                        'cub': '2rem', // 32px
                        'full': '9999px'
                    },
                    fontFamily: {
                        'headline': ['Newsreader', 'serif'],
                        'display': ['Newsreader', 'serif'],
                        'body': ['Inter', 'sans-serif'],
                        'reading': ['Atkinson Hyperlegible', 'sans-serif'],
                        'label': ['Public Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glow-sh {
            text-shadow: 0 0 30px rgba(200, 146, 58, 0.4);
            background: radial-gradient(circle, rgba(200, 146, 58, 0.25) 0%, rgba(200, 146, 58, 0) 70%);
        }
        .faith-halo {
            box-shadow: 0 0 15px rgba(214, 168, 91, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-canvas text-ink-primary font-body antialiased min-h-screen flex flex-col overflow-hidden">
<!-- Top AppBar (from JSON guidance but specialized for Lesson Player) -->
<header class="flex justify-between items-center w-full px-4 h-[60px] max-w-screen-xl mx-auto z-50">
<!-- Progress Chip -->
<div class="flex items-center gap-1.5">
<div class="flex flex-col items-center">
<div class="flex gap-1">
<div class="w-4 h-1.5 rounded-full bg-amber-500"></div>
<div class="w-4 h-1.5 rounded-full bg-amber-500"></div>
<div class="w-4 h-1.5 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(200,146,58,0.6)]"></div>
<div class="w-4 h-1.5 rounded-full border border-amber-500/30"></div>
<div class="w-4 h-1.5 rounded-full border border-amber-500/30"></div>
</div>
<span class="text-[10px] font-body font-medium uppercase tracking-wider text-amber-500 mt-1">Show</span>
</div>
</div>
<!-- Currency & Faith -->
<div class="flex items-center gap-2">
<div class="flex items-center gap-3 bg-surface-raised/50 px-3 py-1.5 rounded-full">
<!-- Depth -->
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[18px] text-moss-500">account_tree</span>
<span class="text-[13px] font-bold text-moss-500">12</span>
</div>
<!-- Explore -->
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[18px] text-slate-500">explore</span>
<span class="text-[13px] font-bold text-slate-500">5</span>
</div>
<!-- Comeback -->
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[18px] text-amber-500">nest_tag</span>
<span class="text-[13px] font-bold text-amber-500">3</span>
</div>
</div>
<button class="w-9 h-9 rounded-full bg-surface-raised flex items-center justify-center border border-faith-gold/20 faith-halo">
<span class="material-symbols-outlined text-faith-gold" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
</button>
</div>
</header>
<!-- Center Lesson Canvas -->
<main class="flex-1 px-4 py-2 flex flex-col">
<section class="flex-1 bg-surface-raised rounded-cub shadow-sm relative overflow-hidden flex flex-col p-8 border border-[#E8DFCA]/50">
<!-- Headline -->
<div class="max-w-[80%]">
<h1 class="font-display italic text-[28px] leading-tight text-ink-primary">
                    Today we'll listen for <span class="text-amber-500">/sh/</span> in words
                </h1>
</div>
<!-- Interaction Content -->
<div class="flex-1 flex flex-col items-center justify-center relative">
<!-- Speaker Icon -->
<button class="mb-6 w-16 h-16 rounded-full bg-amber-500/10 flex items-center justify-center text-amber-500 hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<!-- The Word Display -->
<div class="relative text-center">
<span class="font-reading font-bold text-[96px] leading-none tracking-tight">
<span class="relative inline-block glow-sh">sh</span>ip
                    </span>
<p class="font-reading text-[22px] text-ink-secondary mt-4">Two letters, one sound.</p>
</div>
<!-- Cub Ari Illustration -->
<div class="absolute bottom-4 right-0 w-40 h-40">
<img class="w-full h-full object-contain" data-alt="A warm and soft illustration of Ari, a lion cub with a rounded body and a gentle amber mane, leaning forward with curious, wide eyes looking towards the text. The style is reminiscent of classic storybooks like Where the Wild Things Are, featuring hand-touched ink lines and a rich, sun-drenched parchment background. The atmosphere is quiet, encouraging, and intellectually generous for a six-year-old child." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAXkWEN6SWQE9Wlmh6CWXlw3l7S0eE4G5ONjLEISbKspcej5YP2f1ZJViDrwHnOJb7jp9O8QnPIiqisGoyi22uOHbYcjsKMaV1cNsjSbDF6F1loTe3X4qO2r3aULZIpyG_Er33sODQdGx-takNwUczBwJyD1lnrJPzKbYiIbJnLxgTbTF9ug8tIrVsjgdbGqXhf1Q7RTNdF46wNTLE47JMPpew6zX5PAfYfCggS7RqQ6lF-hglOv80ePIVl7WVvfzxnTJAxSRCaWI"/>
</div>
</div>
<!-- Audio Controls -->
<div class="mt-auto flex flex-col items-center gap-6">
<!-- Waveform placeholder (Visual) -->
<div class="w-full flex items-center justify-center gap-1 h-8">
<div class="w-1 h-3 bg-amber-500/20 rounded-full"></div>
<div class="w-1 h-5 bg-amber-500/30 rounded-full"></div>
<div class="w-1 h-8 bg-amber-500 rounded-full"></div>
<div class="w-1 h-6 bg-amber-500 rounded-full"></div>
<div class="w-1 h-4 bg-amber-500 rounded-full"></div>
<div class="w-1 h-7 bg-amber-500 rounded-full"></div>
<div class="w-1 h-5 bg-amber-500/40 rounded-full"></div>
<div class="w-1 h-3 bg-amber-500/20 rounded-full"></div>
</div>
<!-- Speed Chip -->
<div class="flex items-center gap-1 bg-surface-canvas rounded-full p-1 border border-ink-secondary/10">
<button class="px-3 py-1 text-[12px] font-bold text-ink-secondary opacity-50">0.7x</button>
<button class="px-3 py-1 text-[12px] font-bold bg-amber-500 text-surface-raised rounded-full shadow-sm">0.85x</button>
<button class="px-3 py-1 text-[12px] font-bold text-ink-secondary opacity-50">1.0x</button>
</div>
</div>
</section>
</main>
<!-- Bottom Chrome -->
<footer class="h-[80px] px-6 flex items-center justify-between">
<div class="flex gap-4">
<button class="flex items-center gap-2 text-ink-secondary opacity-70 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[20px]">fire_extinguisher</span>
<span class="text-[14px] font-body font-medium">I'm stuck</span>
</button>
<button class="flex items-center gap-2 text-ink-secondary opacity-70 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[20px]">potted_plant</span>
<span class="text-[14px] font-body font-medium">Take a break</span>
</button>
</div>
<div class="flex items-center gap-3">
<span class="font-display italic text-[18px] text-ink-primary">Ready?</span>
<button class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center text-surface-raised shadow-lg shadow-amber-500/20 hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</div>
</footer>
<!-- Bottom Navigation Shell (Suppressed for transactional Lesson Player as per instructions) -->
<!-- The BottomNavBar and SideNav are hidden to prioritize the Lesson Canvas focus -->
</body></html>
